# The checks that need only Node, on every push and pull request.
#
# The browser half (npm run test:browser, test:audio, test:perf, test:feed)
# needs headless Chromium and a quarter of an hour, and the audio and
# performance suites measure the machine as much as the code; those are run
# by hand before a release rather than on every push.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
